<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Zugang freigeschaltet – Der Frömmigkeitskompass</title>
<style>
@font-face{font-family:"Young Serif";src:url("../fonts/young-serif-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url("../fonts/figtree-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url("../fonts/figtree-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap}
:root{--bg:#131E3D;--plate:#1B2950;--rim:#CDAD7D;--ink:#EEF2FA;--muted:#A8B4CE;--on-yolk:#131E3D;color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5;display:grid;place-items:center}
main{max-width:520px;padding:32px 24px;text-align:center}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(2rem,6vw,2.8rem);line-height:1.15;margin:0 0 14px}
p{color:var(--muted);margin:0 0 26px}
.btn{display:inline-block;border:0;padding:14px 30px;background:var(--rim);color:var(--on-yolk);font-weight:600;text-decoration:none}
.btn:focus-visible{outline:3px solid var(--rim);outline-offset:3px}
.hinweis{font-size:.9rem;margin-top:26px}
</style>
</head>
<body>
<main>
  <h1 id="titel">Danke für deinen Kauf!</h1>
  <p id="text">Dein Zugang zum Frömmigkeitskompass ist auf diesem Gerät freigeschaltet. Du wirst gleich zum Test weitergeleitet.</p>
  <a class="btn" href="../">Zum Test</a>
  <p class="hinweis">Auf einem anderen Gerät oder in einem anderen Browser? Öffne einfach noch einmal den Link aus deiner Kaufbestätigung.</p>
</main>
<script>
  var ok = false;
  try { localStorage.setItem("kompass_zugang", String(Date.now())); ok = true; } catch (e) {}
  if (ok) {
    setTimeout(function () { location.replace("../"); }, 2500);
  } else {
    document.getElementById("text").textContent =
      "Dein Browser blockiert gespeicherte Daten (zum Beispiel im privaten Modus). Öffne diesen Link bitte in einem normalen Browserfenster, dann wird dein Zugang freigeschaltet.";
  }
</script>
</body>
</html>
